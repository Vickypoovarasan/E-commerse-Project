<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <div>
            <span class="navbar-brand">Admin Dashboard</span>
            <div class="admin-info" style="font-size: 11px; margin-top: 5px;">
                Logged in as: <strong id="adminUsername"></strong>
            </div>
        </div>
        <div>
            <button onclick="logout()" class="btn btn-warning btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- STATS -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="stats-box">
                <div class="stats-number" id="totalProducts">0</div>
                <div class="stats-label">Total Products</div>
            </div>
        </div>
    </div>

    <!-- PAGE TITLE -->
    <div class="page-title">Product Management</div>

    <!-- ADD PRODUCT BUTTON -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="goAddProduct()" class="btn-add-product">Add New Product</button>
    </div>

    <!-- PRODUCTS TABLE -->
    <div class="table-container">
        <table class="table table-hover" id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsList">
            </tbody>
        </table>
        <div id="noData" class="no-data" style="display: none;">
            <h5>📭 No products found</h5>
            <p>Click "Add New Product" to create your first product</p>
        </div>
    </div>

</div>

<script>

    // ✅ Check admin login
    let userId = localStorage.getItem("userId");
    let userType = localStorage.getItem("userType");
    let adminUsername = localStorage.getItem("username");

    if (!userId || userType !== "ADMIN") {
        alert("❌ Please login as admin first");
        window.location.href = "admin-login.html";
    }

    // Display admin username
    document.getElementById("adminUsername").innerText = adminUsername || "Admin";

    // ✅ Fetch all products
    function loadProducts() {
        fetch("http://localhost:9090/api/products")
        .then(res => res.json())
        .then(data => {

            let container = document.getElementById("productsList");
            container.innerHTML = "";

            if(data.length === 0) {
                document.getElementById("noData").style.display = "block";
                document.getElementById("productsTable").style.display = "none";
                document.getElementById("totalProducts").innerText = 0;
                return;
            }

            document.getElementById("noData").style.display = "none";
            document.getElementById("productsTable").style.display = "table";
            document.getElementById("totalProducts").innerText = data.length;

            data.forEach(product => {
                let row = document.createElement("tr");

                row.innerHTML = `
                    <td><strong>${product.productId}</strong></td>
                    <td>${product.name}</td>
                    <td>${product.description || "N/A"}</td>
                    <td>${product.category || "Uncategorized"}</td>
                    <td><strong>₹${product.price}</strong></td>
                    <td>${product.stockQuantity}</td>
                    <td>
                        <button onclick="editProduct(${product.productId})" class="btn-edit">Edit</button>
                        <button onclick="deleteProduct(${product.productId})" class="btn-delete">Delete</button>
                    </td>
                `;

                container.appendChild(row);
            });
        })
        .catch(err => {
            console.error("Error loading products:", err);
            alert("❌ Failed to load products");
        });
    }

    // ✅ Edit product
    function editProduct(productId) {
        localStorage.setItem("editProductId", productId);
        window.location.href = "edit-product.html";
    }

    // ✅ Delete product
    function deleteProduct(productId) {
        if(confirm("Are you sure you want to delete this product?")) {
            fetch(`http://localhost:9090/api/products/${productId}`, {
                method: "DELETE"
            })
            .then(res => res.text())
            .then(message => {
                alert("Product deleted successfully");
                loadProducts();
            })
            .catch(err => {
                console.error("Error deleting product:", err);
                alert("❌ Failed to delete product");
            });
        }
    }

    // ✅ Navigation
    function goAddProduct() {
        window.location.href = "add-product.html";
    }

    function logout() {
        localStorage.clear();
        window.location.href = "admin-login.html";
    }

    // Load products on page load
    loadProducts();

    // Refresh products every 10 seconds
    setInterval(loadProducts, 10000);

</script>

</body>
</html>
