<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="page-container">
    <div class="form card">
        <div style="margin-bottom: 1rem; display:flex; align-items:center; gap:0.75rem;">
            <div style="background: rgba(58, 168, 86, 0.15); color: #2e8d4f; padding: 0.55rem 0.75rem; border-radius: 0.75rem; font-size: 0.95rem; font-weight: 700;">
                Success
            </div>
            <h2 style="margin:0; font-size: 1.75rem;">Order Completed</h2>
        </div>

        <p class="form-description">Thank you! Your payment was successful and your invoice is ready to download.</p>

        <div class="info-card">
            <div class="summary-line"><span>Order Reference</span><strong id="orderRef">#N/A</strong></div>
            <div class="summary-line"><span>Status</span><strong>Completed</strong></div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
            <button onclick="downloadInvoice()" class="btn btn-custom flex-fill">Download PDF</button>
            <button onclick="downloadInvoiceTxt()" class="btn btn-secondary flex-fill">Download TXT</button>
        </div>

        <button onclick="goHome()" class="btn btn-home w-100">Back to Home</button>
    </div>
</div>

<script>
    function goHome() {
        window.location.href = "index.html";
    }

    function downloadInvoice() {
        const orderId = localStorage.getItem("orderId");
        if (!orderId) {
            alert("No invoice available.");
            return;
        }
        window.location.href = `/api/invoices/${orderId}`;
    }

    function downloadInvoiceTxt() {
        const orderId = localStorage.getItem("orderId");
        if (!orderId) {
            alert("No invoice available.");
            return;
        }
        window.location.href = `/api/invoices/${orderId}/txt`;
    }

    const orderId = localStorage.getItem("orderId");
    if (orderId) {
        document.getElementById("orderRef").innerText = `#${orderId}`;
    }
</script>

</body>
</html>
