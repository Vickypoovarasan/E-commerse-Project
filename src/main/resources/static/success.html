<!DOCTYPE html>
<html>
<head>
    <title>Success</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="success-box">

                <div class="tick">Order Complete</div>

                <div class="success-text">
                    Order Placed Successfully!
                </div>

                <p>Your payment has been completed and your invoice is ready.</p>

                <button onclick="downloadInvoice()" class="btn btn-home">
                    Download Invoice PDF
                </button>
                <button onclick="downloadInvoiceTxt()" class="btn btn-home mt-2">
                    Download Invoice TXT
                </button>

                <button onclick="goHome()" class="btn btn-home mt-3">
                    Back to Home
                </button>

            </div>

        </div>
    </div>

</div>

<script>
    /* ✅ Auto Redirect after 3 seconds */
    function goHome(){
        window.location.href = "index.html";
    }

    function downloadInvoice(){
        const orderId = localStorage.getItem("orderId");
        if (!orderId) {
            alert("No invoice available.");
            return;
        }
        window.location.href = `http://localhost:9090/api/invoices/${orderId}`;
    }

    function downloadInvoiceTxt(){
        const orderId = localStorage.getItem("orderId");
        if (!orderId) {
            alert("No invoice available.");
            return;
        }
        window.location.href = `http://localhost:9090/api/invoices/${orderId}/txt`;
    }
</script>

</body>
</html>
