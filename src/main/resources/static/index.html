<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">My Store</div>
        <div class="d-flex gap-2">
            <button onclick="goCart()" class="btn btn-outline-dark btn-sm">Cart</button>
            <button onclick="goOrders()" class="btn btn-outline-dark btn-sm">Orders</button>
            <button onclick="logout()" class="btn btn-outlinedark btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="page-container">
    <div class="form card">
        <h2>Featured Products</h2>
        <p class="form-description">Browse categories and add your favorites to the cart with a single click.</p>

        <div class="row category-row">
            <div class="col-sm-6 col-md-3 mb-3">
                <div class="category-card" onclick="loadProducts('Electronics'); scrollToProducts();">
                    <strong>Electronics</strong>
                    <span>Smart devices & accessories</span>
                </div>
            </div>
            <div class="col-sm-6 col-md-3 mb-3">
                <div class="category-card" onclick="loadProducts('Fashion'); scrollToProducts();">
                    <strong>Fashion</strong>
                    <span>Apparel & lifestyle</span>
                </div>
            </div>
            <div class="col-sm-6 col-md-3 mb-3">
                <div class="category-card" onclick="loadProducts('Home'); scrollToProducts();">
                    <strong>Home</strong>
                    <span>Decor & kitchen essentials</span>
                </div>
            </div>
            <div class="col-sm-6 col-md-3 mb-3">
                <div class="category-card" onclick="loadProducts('Beauty'); scrollToProducts();">
                    <strong>Beauty</strong>
                    <span>Wellness & grooming</span>
                </div>
            </div>
        </div>

        <div id="categoryFilters" class="d-flex flex-nowrap gap-2 mb-4 overflow-auto"></div>

        <div class="row product-grid" id="productList"></div>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");
    const categories = ['All', 'Electronics', 'Fashion', 'Home', 'Beauty', 'Kitchen'];

    function renderCategoryButtons() {
        const filterContainer = document.getElementById('categoryFilters');
        filterContainer.innerHTML = '';

        categories.forEach(category => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn btn-sm btn-outline-dark';
            button.textContent = category;
            button.onclick = () => loadProducts(category === 'All' ? undefined : category);
            filterContainer.appendChild(button);
        });
    }

    function loadProducts(category) {
        let url = "/api/products";
        if (category) {
            url += `?category=${encodeURIComponent(category)}`;
        }

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("productList");
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center py-5">No products found for this category.</div>';
                    return;
                }

                data.forEach(p => {
                    const col = document.createElement("div");
                    col.className = "col-lg-4 col-md-6 mb-4";
                    col.innerHTML = `
                        <div class="product-card h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div class="text-muted mb-2">${p.category || 'Uncategorized'}</div>
                                <h4>${p.name}</h4>
                                <p>${p.description || 'No description available.'}</p>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <strong>₹${p.price}</strong>
                                <button onclick="addToCart(${p.productId})" class="btn btn-custom btn-sm">Add to Cart</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });
            })
            .catch(err => {
                console.error("Error loading products:", err);
                document.getElementById("productList").innerHTML = '<div class="col-12 text-center py-5">Unable to load products at the moment.</div>';
            });
    }

    function scrollToProducts() {
        const productsSection = document.getElementById('productList');
        if (productsSection) {
            productsSection.scrollIntoView({ behavior: 'smooth' });
        }
    }

    function addToCart(productId) {
        if (!userId) {
            alert("Please login to add items to cart.");
            window.location.href = "login.html";
            return;
        }

        fetch("/api/cart", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                userId: userId,
                productId: productId,
                quantity: 1
            })
        })
            .then(() => alert("Product added to cart."))
            .catch(err => {
                console.error("Cart error:", err);
                alert("Failed to add item to cart.");
            });
    }

    function goCart() { window.location.href = "cart.html"; }
    function goOrders() { window.location.href = "orders.html"; }
    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    renderCategoryButtons();
    loadProducts();
</script>

</body>
</html>
