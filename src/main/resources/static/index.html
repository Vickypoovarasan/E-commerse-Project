<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

  <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
  <div class="container d-flex justify-content-between align-items-center py-3">
    <div class="brand-text">My Store</div>
    <div class="nav-actions">
      <button onclick="goCart()" class="btn btn-outline-dark btn-sm">Cart</button>
      <button onclick="goOrders()" class="btn btn-outline-dark btn-sm">Orders</button>
      <button onclick="logout()" class="btn btn-dark btn-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <div class="row category-row">
    <div class="col-sm-6 col-md-3 mb-3">
      <div class="category-card" onclick="loadProducts('Electronics'); scrollToProducts();">
        <strong>Electronics</strong>
        <span>Smart devices, headphones</span>
      </div>
    </div>
    <div class="col-sm-6 col-md-3 mb-3">
      <div class="category-card" onclick="loadProducts('Fashion'); scrollToProducts();">
        <strong>Fashion</strong>
        <span>Clothing, shoes, accessories</span>
      </div>
    </div>
    <div class="col-sm-6 col-md-3 mb-3">
      <div class="category-card" onclick="loadProducts('Home'); scrollToProducts();">
        <strong>Home</strong>
        <span>Decor, kitchen essentials</span>
      </div>
    </div>
    <div class="col-sm-6 col-md-3 mb-3">
      <div class="category-card" onclick="loadProducts('Beauty'); scrollToProducts();">
        <strong>Beauty</strong>
        <span>Grooming and wellness</span>
      </div>
    </div>
  </div>

  <div class="store-title">Featured Products</div>
  <div class="row category-row mb-3">
    <div class="col-12">
      <div class="d-flex flex-wrap gap-2">
        <button onclick="loadProducts()" class="btn btn-sm btn-outline-dark">All</button>
        <button onclick="loadProducts('Electronics')" class="btn btn-sm btn-outline-dark">Electronics</button>
        <button onclick="loadProducts('Fashion')" class="btn btn-sm btn-outline-dark">Fashion</button>
        <button onclick="loadProducts('Home')" class="btn btn-sm btn-outline-dark">Home</button>
        <button onclick="loadProducts('Beauty')" class="btn btn-sm btn-outline-dark">Beauty</button>
      </div>
    </div>
  </div>
  <div class="row product-grid" id="productList"></div>
</div>

<script>
  const userId = localStorage.getItem("userId");

  function loadProducts(category) {
    let url = "http://localhost:9090/api/products";
    if (category) {
      url += `?category=${encodeURIComponent(category)}`;
    }

    fetch(url)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("productList");
        container.innerHTML = "";

        if (data.length === 0) {
          container.innerHTML = '<div class="col-12 text-center py-5">No products found for this category.</div>';
          return;
        }

        data.forEach(p => {
          const col = document.createElement("div");
          col.className = "col-lg-4 col-md-4 col-sm-6 mb-4";

          col.innerHTML = `
            <div class="product-card">
              <div class="text-muted mb-2">${p.category || 'Uncategorized'}</div>
              <h4>${p.name}</h4>
              <p>${p.description || 'No description available.'}</p>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <strong>₹${p.price}</strong>
                <button onclick="addToCart(${p.productId})" class="btn btn-custom btn-sm">Add to Cart</button>
              </div>
            </div>
          `;

          container.appendChild(col);
        });
      })
      .catch(err => console.error("Error loading products:", err));
  }

  function scrollToProducts() {
    document.getElementById('productList').scrollIntoView({ behavior: 'smooth' });
  }

  loadProducts();

  function addToCart(productId) {
    if (!userId) {
      alert("Please login to add items to cart.");
      window.location.href = "login.html";
      return;
    }

    fetch("http://localhost:9090/api/cart", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        userId: userId,
        productId: productId,
        quantity: 1
      })
    })
      .then(() => alert("Product added to cart."))
      .catch(err => {
        console.error("Cart error:", err);
        alert("Failed to add item to cart.");
      });
  }

  function goCart() { window.location.href = "cart.html"; }
  function goOrders() { window.location.href = "orders.html"; }
  function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  }

</script>

</body>
</html>
