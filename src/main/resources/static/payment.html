<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">Checkout</div>
        <button onclick="goHome()" class="btn btn-secondary btn-sm">Home</button>
    </div>
</nav>

<div class="page-container">
    <div class="form card">
        <h2>Checkout & Delivery</h2>
        <p class="form-description">Confirm your order details and complete the payment to receive your invoice.</p>

        <div class="info-card">
            <div class="summary-line"><span>Order Total</span><strong>₹<span id="amount">0</span></strong></div>
            <div class="summary-line"><span>Cart Items</span><strong><span id="itemCount">0</span></strong></div>
        </div>

        <div class="info-card">
            <label class="form-label" for="shippingAddress">Shipping Address</label>
            <textarea id="shippingAddress" class="form-control mt-2" rows="4" placeholder="Enter delivery address"></textarea>
        </div>

        <div class="info-card">
            <label class="form-label" for="deliveryNote">Delivery Note <span style="font-size:0.9rem;color:var(--text-muted);">(optional)</span></label>
            <textarea id="deliveryNote" class="form-control mt-2" rows="3" placeholder="Leave a note for the delivery partner"></textarea>
        </div>

        <button onclick="payNow()" class="btn btn-custom w-100">Pay & Continue</button>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login before checkout.");
        window.location.href = "login.html";
    }

    function loadCartSummary() {
        fetch(`/api/cart/${userId}`)
            .then(res => res.json())
            .then(data => {
                let totalAmount = 0;
                let itemCount = 0;

                data.forEach(item => {
                    totalAmount += item.price * item.quantity;
                    itemCount += item.quantity;
                });

                document.getElementById("amount").innerText = totalAmount.toFixed(2);
                document.getElementById("itemCount").innerText = itemCount;

                if (itemCount === 0) {
                    alert("Your cart is empty. Add items before checkout.");
                    window.location.href = "cart.html";
                }
            })
            .catch(err => {
                console.error("Error loading cart summary:", err);
                alert("Failed to load cart information.");
            });
    }

    function payNow() {
        const shippingAddress = document.getElementById("shippingAddress").value.trim();
        const deliveryNote = document.getElementById("deliveryNote").value.trim();

        if (!shippingAddress) {
            alert("Please enter a delivery address.");
            return;
        }

        fetch(`/api/orders/${userId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                shippingAddress: shippingAddress,
                deliveryNote: deliveryNote
            })
        })
            .then(res => res.json())
            .then(order => {
                localStorage.setItem("orderId", order.orderId);
                return fetch(`/api/payments/${order.orderId}`, {
                    method: "POST"
                });
            })
            .then(() => {
                window.location.href = "success.html";
            })
            .catch(err => {
                console.error("Payment error:", err);
                alert("Payment failed. Please try again.");
            });
    }

    function goHome() {
        window.location.href = "index.html";
    }

    loadCartSummary();
</script>

</body>
</html>
