<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

  <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
  <div class="container d-flex justify-content-between align-items-center py-3">
    <div class="brand-text">Checkout</div>
    <button onclick="goHome()" class="btn btn-dark btn-sm">Home</button>
  </div>
</nav>

<div class="container">
  <div class="payment-box">
    <h3>Checkout & Delivery</h3>

    <div class="info-card">
      <div class="summary-line">
        <span>Order Total</span>
        <span>₹<strong id="amount">0</strong></span>
      </div>
      <div class="summary-line">
        <span>Items in Cart</span>
        <span><strong id="itemCount">0</strong></span>
      </div>
    </div>

    <div class="info-card">
      <h5>Shipping Address</h5>
      <textarea id="shippingAddress" class="form-control mt-2" rows="3" placeholder="Enter full delivery address"></textarea>
    </div>

    <div class="info-card">
      <h5>Delivery Note</h5>
      <textarea id="deliveryNote" class="form-control mt-2" rows="2" placeholder="Add a note for the delivery partner (optional)"></textarea>
    </div>

    <button onclick="payNow()" class="btn btn-custom mt-3">
      Pay & Download Invoice
    </button>
  </div>
</div>

<script>
  const userId = localStorage.getItem("userId");

  if (!userId) {
    alert("Please login before checkout.");
    window.location.href = "login.html";
  }

  function loadCartSummary() {
    fetch(`http://localhost:9090/api/cart/${userId}`)
      .then(res => res.json())
      .then(data => {
        let totalAmount = 0;
        let itemCount = 0;

        data.forEach(item => {
          totalAmount += item.price * item.quantity;
          itemCount += item.quantity;
        });

        document.getElementById("amount").innerText = totalAmount.toFixed(2);
        document.getElementById("itemCount").innerText = itemCount;

        if (itemCount === 0) {
          alert("Your cart is empty. Add items before checkout.");
          window.location.href = "cart.html";
        }
      })
      .catch(err => {
        console.error("Error loading cart summary:", err);
        alert("Failed to load cart information.");
      });
  }

  function payNow() {
    const shippingAddress = document.getElementById("shippingAddress").value.trim();
    const deliveryNote = document.getElementById("deliveryNote").value.trim();

    if (!shippingAddress) {
      alert("Please enter a delivery address.");
      return;
    }

    fetch(`http://localhost:9090/api/orders/${userId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        shippingAddress: shippingAddress,
        deliveryNote: deliveryNote
      })
    })
      .then(res => res.json())
      .then(order => {
        localStorage.setItem("orderId", order.orderId);
        return fetch(`http://localhost:9090/api/payments/${order.orderId}`, {
          method: "POST"
        });
      })
      .then(() => {
        window.location.href = "success.html";
      })
      .catch(err => {
        console.error("Payment error:", err);
        alert("Payment failed. Please try again.");
      });
  }

  function goHome() {
    window.location.href = "index.html";
  }

  loadCartSummary();
</script>

</body>
</html>
