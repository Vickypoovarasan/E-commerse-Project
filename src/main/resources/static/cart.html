<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">Your Cart</div>
        <button onclick="goHome()" class="btn btn-secondary btn-sm">Home</button>
    </div>
</nav>

<div class="page-container">
    <div class="form card">
        <h2>Items in Cart</h2>
        <p class="form-description">Review the items you selected and move to checkout when ready.</p>

        <div id="cartList"></div>

        <div class="info-card">
            <div class="summary-line"><span>Total Items</span><strong><span id="totalItems">0</span></strong></div>
            <div class="summary-line"><span>Total Amount</span><strong>₹<span id="totalAmount">0</span></strong></div>
        </div>

        <button onclick="goPayment()" class="btn btn-custom checkout-button">Checkout Now</button>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");

    function loadCart() {
        if (!userId) {
            alert("Please login to view your cart.");
            window.location.href = "login.html";
            return;
        }

        fetch(`/api/cart/${userId}`)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById("cartList");
                container.innerHTML = "";

                let totalItems = 0;
                let totalAmount = 0;

                if (data.length === 0) {
                    container.innerHTML = '<div class="no-data"><h5>No items in cart yet.</h5><p>Browse products and add them to your cart.</p></div>';
                }

                data.forEach(c => {
                    const itemTotal = c.price * c.quantity;
                    totalItems += c.quantity;
                    totalAmount += itemTotal;

                    const div = document.createElement("div");
                    div.className = "card product-card mb-3";
                    div.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5>${c.productName}</h5>
                                <p class="text-muted mb-1">Price: ₹${c.price} × ${c.quantity}</p>
                                <p class="text-muted mb-0">Total: ₹${itemTotal.toFixed(2)}</p>
                            </div>
                            <button onclick="removeItem(${c.cartId})" class="btn btn-delete">Remove</button>
                        </div>
                    `;
                    container.appendChild(div);
                });

                document.getElementById("totalItems").innerText = totalItems;
                document.getElementById("totalAmount").innerText = totalAmount.toFixed(2);
            })
            .catch(err => {
                console.error("Error loading cart:", err);
                alert("Unable to load cart items.");
            });
    }

    function removeItem(cartId) {
        fetch(`/api/cart/${cartId}`, {
            method: "DELETE"
        })
            .then(() => loadCart())
            .catch(err => {
                console.error("Cart remove error:", err);
                alert("Failed to remove item.");
            });
    }

    function goPayment() {
        const totalAmount = parseFloat(document.getElementById("totalAmount").innerText || 0);
        if (totalAmount <= 0) {
            alert("Your cart is empty. Add products before checkout.");
            return;
        }
        window.location.href = "payment.html";
    }

    function goHome() {
        window.location.href = "index.html";
    }

    loadCart();
</script>

</body>
</html>
