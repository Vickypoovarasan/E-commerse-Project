<!DOCTYPE html>
<html>
<head>
    <title>Order History</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">Order History</div>
        <button onclick="goHome()" class="btn btn-secondary btn-sm">Home</button>
    </div>
</nav>

<div class="page-container">
    <div class="form card">
        <h2>My Orders</h2>
        <p class="form-description">Track your completed purchases and download invoices from past orders.</p>

        <div id="orderList"></div>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");

    if (!userId) {
        alert("Please login first.");
        window.location.href = "login.html";
    }

    function loadOrders() {
        fetch(`/api/orders/${userId}`)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("orderList");
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-data"><h5>No orders found yet.</h5><p>Complete a purchase to see your orders here.</p></div>';
                    return;
                }

                data.forEach(order => {
                    const orderCard = document.createElement("div");
                    orderCard.className = "card mb-3";
                    orderCard.innerHTML = `
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div>
                                    <h5>Order #${order.orderId}</h5>
                                    <p class="text-muted mb-1">Ordered on: ${order.orderDate}</p>
                                </div>
                                <span class="badge bg-success">${order.status}</span>
                            </div>
                            <p class="mb-1"><strong>Total Amount:</strong> ₹${order.totalAmount}</p>
                            <p class="mb-1"><strong>Shipping:</strong> ${order.shippingAddress || 'Not provided'}</p>
                            <p><strong>Note:</strong> ${order.deliveryNote || 'None'}</p>
                            <div class="d-flex flex-wrap gap-2 mt-3">
                                <button onclick="downloadInvoice(${order.orderId})" class="btn btn-custom btn-sm">Invoice PDF</button>
                                <button onclick="downloadInvoiceTxt(${order.orderId})" class="btn btn-secondary btn-sm">Invoice TXT</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(orderCard);
                });
            })
            .catch(err => {
                console.error("Error fetching orders:", err);
                alert("Failed to load orders.");
            });
    }

    function goHome() {
        window.location.href = "index.html";
    }

    function downloadInvoice(orderId) {
        window.location.href = `/api/invoices/${orderId}`;
    }

    function downloadInvoiceTxt(orderId) {
        window.location.href = `/api/invoices/${orderId}/txt`;
    }

    loadOrders();
</script>

</body>
</html>
``
