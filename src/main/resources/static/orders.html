<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
    <div class="container d-flex justify-content-between">
        <span class="navbar-brand">My Orders</span>
        <button onclick="goHome()" class="btn btn-warning">Home</button>
    </div>
</nav>

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-6" id="orderList"></div>
    </div>

</div>

<script>

    let userId = localStorage.getItem("userId");

    // ✅ Check login
    if (!userId) {
        alert("❌ Please login first");
        window.location.href = "login.html";
    }

    // ✅ Fetch orders
    fetch(`http://localhost:9090/api/orders/${userId}`)
    .then(response => response.json())
    .then(data => {

        let container = document.getElementById("orderList");
        container.innerHTML = "";

        // ✅ No orders
        if (data.length === 0) {
            container.innerHTML = "<h4 class='text-center'>No Orders Found</h4>";
            return;
        }

        // ✅ Display orders
        data.forEach(order => {

            let div = document.createElement("div");

            div.innerHTML = `
                <div class="card mt-3 p-3">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5>Order ID: ${order.orderId}</h5>
                            <p><strong>Order Date:</strong> ${order.orderDate}</p>
                        </div>
                        <span class="badge bg-success">${order.status}</span>
                    </div>

                    <p><strong>Total Amount:</strong> ₹${order.totalAmount}</p>
                    <p><strong>Shipping Address:</strong> ${order.shippingAddress || 'Not provided'}</p>
                    <p><strong>Delivery Note:</strong> ${order.deliveryNote || 'None'}</p>

                    <button onclick="downloadInvoice(${order.orderId})" class="btn btn-custom btn-sm mt-2 me-2">Download Invoice</button>
                    <button onclick="downloadInvoiceTxt(${order.orderId})" class="btn btn-secondary btn-sm mt-2">Download Invoice TXT</button>
                </div>
            `;

            container.appendChild(div);
        });

    })
    .catch(err => {
        console.error("Error fetching orders:", err);
        alert("❌ Failed to load orders");
    });

    // ✅ Navigation
    function goHome(){
        window.location.href = "index.html";
    }

    function downloadInvoice(orderId){
        window.location.href = `http://localhost:9090/api/invoices/${orderId}`;
    }

    function downloadInvoiceTxt(orderId){
        window.location.href = `http://localhost:9090/api/invoices/${orderId}/txt`;
    }

</script>

</body>
</html>
``
