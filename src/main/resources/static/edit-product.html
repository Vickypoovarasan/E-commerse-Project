<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">Edit Product</div>
        <button onclick="goBack()" class="btn btn-secondary btn-sm">Back</button>
    </div>
</nav>

<div class="page-container">
    <div id="loadingSpinner" class="loading">⏳ Loading product details...</div>

    <div id="formContainer" class="form card" style="display: none;">
        <h2>Update Product</h2>
        <p class="form-description">Make changes and save the latest product details.</p>

        <label class="form-label" for="productId">Product ID</label>
        <input type="text" id="productId" class="form-control" disabled>

        <label class="form-label mt-3" for="productName">Product Name</label>
        <input type="text" id="productName" class="form-control" placeholder="Enter product name" required>

        <label class="form-label mt-3" for="productDescription">Description</label>
        <textarea id="productDescription" class="form-control" rows="4" placeholder="Enter product description"></textarea>

        <label class="form-label mt-3" for="productPrice">Price (₹)</label>
        <input type="number" id="productPrice" class="form-control" placeholder="Enter price" step="0.01" required>

        <label class="form-label mt-3" for="productStock">Stock Quantity</label>
        <input type="number" id="productStock" class="form-control" placeholder="Enter stock quantity" required>

        <label class="form-label mt-3" for="productCategory">Category</label>
        <select id="productCategory" class="form-control">
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Home">Home</option>
            <option value="Beauty">Beauty</option>
        </select>

        <div id="errorMsg" class="mt-3" style="display:none;color:#d83131;font-weight:600;"></div>
        <div id="successMsg" class="mt-3" style="display:none;color:#1e8f51;font-weight:600;"></div>

        <div class="d-flex gap-3 mt-4 flex-wrap">
            <button onclick="updateProduct()" class="btn btn-custom flex-fill">Update Product</button>
            <button onclick="goBack()" class="btn btn-secondary flex-fill">Cancel</button>
        </div>
    </div>
</div>

<script>
    const userId = localStorage.getItem("userId");
    const userType = localStorage.getItem("userType");

    if (!userId || userType !== "ADMIN") {
        alert("Please login as admin first.");
        window.location.href = "admin-login.html";
    }

    const editProductId = localStorage.getItem("editProductId");
    if (!editProductId) {
        alert("No product selected.");
        window.location.href = "admin-dashboard.html";
    }

    fetch(`/api/products/${editProductId}`)
        .then(res => res.json())
        .then(product => {
            if (!product || !product.productId) {
                throw new Error("Product not found");
            }

            document.getElementById("loadingSpinner").style.display = "none";
            const form = document.getElementById("formContainer");
            form.style.display = "block";

            document.getElementById("productId").value = product.productId;
            document.getElementById("productName").value = product.name || "";
            document.getElementById("productDescription").value = product.description || "";
            document.getElementById("productPrice").value = product.price || "";
            document.getElementById("productStock").value = product.stockQuantity || "";
            document.getElementById("productCategory").value = product.category || "Electronics";
        })
        .catch(err => {
            console.error("Error loading product:", err);
            alert("Failed to load product details.");
            window.location.href = "admin-dashboard.html";
        });

    function updateProduct() {
        const name = document.getElementById("productName").value.trim();
        const description = document.getElementById("productDescription").value.trim();
        const price = parseFloat(document.getElementById("productPrice").value);
        const stock = parseInt(document.getElementById("productStock").value, 10);
        const category = document.getElementById("productCategory").value;

        const errorMsg = document.getElementById("errorMsg");
        const successMsg = document.getElementById("successMsg");
        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        if (!name || isNaN(price) || isNaN(stock)) {
            errorMsg.textContent = "Please fill in all required fields with valid values.";
            errorMsg.style.display = "block";
            return;
        }

        if (price <= 0 || stock < 0) {
            errorMsg.textContent = "Price and stock must be valid non-negative values.";
            errorMsg.style.display = "block";
            return;
        }

        fetch(`/api/products/${editProductId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, description, price, stockQuantity: stock, category })
        })
            .then(res => res.json())
            .then(() => {
                successMsg.textContent = "Product updated successfully. Redirecting...";
                successMsg.style.display = "block";
                localStorage.removeItem("editProductId");
                setTimeout(() => window.location.href = "admin-dashboard.html", 1500);
            })
            .catch(err => {
                console.error("Error updating product:", err);
                errorMsg.textContent = "Failed to update product. Please try again.";
                errorMsg.style.display = "block";
            });
    }

    function goBack() {
        localStorage.removeItem("editProductId");
        window.location.href = "admin-dashboard.html";
    }
</script>

</body>
</html>
