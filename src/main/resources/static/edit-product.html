<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand">Edit Product</span>
        <button onclick="goBack()" class="btn btn-warning btn-sm">Back to Dashboard</button>
    </div>
</nav>

<div class="container">

    <div id="loadingSpinner" class="loading">
        ⏳ Loading product details...
    </div>

    <div id="formContainer" class="form-container" style="display: none;">

        <h2>Update Product Information</h2>

        <div class="form-group">
            <label class="form-label">Product ID</label>
            <input type="text" id="productId" class="form-control" disabled>
        </div>

        <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" id="productName" class="form-control" placeholder="Enter product name" required>
        </div>

        <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="productDescription" class="form-control" rows="3" placeholder="Enter product description"></textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Price (₹) *</label>
            <input type="number" id="productPrice" class="form-control" placeholder="Enter price" step="0.01" required>
        </div>

        <div class="form-group">
            <label class="form-label">Stock Quantity *</label>
            <input type="number" id="productStock" class="form-control" placeholder="Enter stock quantity" required>
        </div>

        <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="productCategory" class="form-control">
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Beauty">Beauty</option>
            </select>
        </div>

        <div id="successMsg"></div>
        <div id="errorMsg"></div>

        <div style="text-align: center;">
            <button onclick="updateProduct()" class="btn-update">Update Product</button>
            <button onclick="goBack()" class="btn-cancel">❌ Cancel</button>
        </div>

    </div>

</div>

<script>

    // ✅ Check admin login
    let userId = localStorage.getItem("userId");
    let userType = localStorage.getItem("userType");

    if (!userId || userType !== "ADMIN") {
        alert("❌ Please login as admin first");
        window.location.href = "admin-login.html";
    }

    // Get product ID to edit
    let editProductId = localStorage.getItem("editProductId");

    if (!editProductId) {
        alert("❌ No product selected");
        window.location.href = "admin-dashboard.html";
    }

    // ✅ Load product details
    fetch(`http://localhost:9090/api/products/${editProductId}`)
    .then(res => res.json())
    .then(product => {

        if (!product.productId) {
            throw new Error("Product not found");
        }

        // Load form
        document.getElementById("loadingSpinner").style.display = "none";
        document.getElementById("formContainer").style.display = "block";

        // Populate form
        document.getElementById("productId").value = product.productId;
        document.getElementById("productName").value = product.name;
        document.getElementById("productDescription").value = product.description || "";
        document.getElementById("productPrice").value = product.price;
        document.getElementById("productStock").value = product.stockQuantity;
        document.getElementById("productCategory").value = product.category || "Electronics";

    })
    .catch(err => {
        console.error("Error loading product:", err);
        alert("❌ Failed to load product details");
        window.location.href = "admin-dashboard.html";
    });

    // ✅ Update product
    function updateProduct() {

        let name = document.getElementById("productName").value;
        let description = document.getElementById("productDescription").value;
        let price = parseFloat(document.getElementById("productPrice").value);
        let stock = parseInt(document.getElementById("productStock").value);

        // Validation
        if (!name || !price || !stock) {
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("errorMsg").textContent = "❌ Please fill in all required fields";
            return;
        }

        if (price <= 0 || stock < 0) {
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("errorMsg").textContent = "❌ Price and stock must be valid numbers";
            return;
        }

        // Send update
        fetch(`http://localhost:9090/api/products/${editProductId}`, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                description: description,
                price: price,
                stockQuantity: stock,
                category: document.getElementById("productCategory").value
            })
        })
        .then(res => res.json())
        .then(updatedProduct => {

            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("successMsg").style.display = "block";
            document.getElementById("successMsg").textContent = "Product updated successfully! Redirecting...";

            // Clear edit product ID
            localStorage.removeItem("editProductId");

            // Redirect after 2 seconds
            setTimeout(() => {
                window.location.href = "admin-dashboard.html";
            }, 2000);

        })
        .catch(err => {
            console.error("Error updating product:", err);
            document.getElementById("successMsg").style.display = "none";
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("errorMsg").textContent = "❌ Failed to update product";
        });
    }

    // ✅ Navigation
    function goBack() {
        localStorage.removeItem("editProductId");
        window.location.href = "admin-dashboard.html";
    }

</script>

</body>
</html>
