<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light">
    <div class="container">
        <span class="navbar-brand">Add Product</span>
    </div>
</nav>

<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="form-box">

                <h3 class="text-center">Add New Product</h3>

                <input id="name" class="form-control mt-2" placeholder="Product Name">

                <input id="description" class="form-control mt-2" placeholder="Description">

                <input id="price" class="form-control mt-2" placeholder="Price">

                <input id="stock" class="form-control mt-2" placeholder="Stock Quantity">

                <select id="category" class="form-control mt-2">
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Home">Home</option>
                    <option value="Beauty">Beauty</option>
                </select>

                <button onclick="addProduct()" class="btn btn-custom w-100 mt-3">
                    Add Product
                </button>

            </div>

        </div>
    </div>

</div>

<script>

    function addProduct(){

        let products = [{
            name: document.getElementById("name").value,
            description: document.getElementById("description").value,
            price: parseFloat(document.getElementById("price").value),
            stockQuantity: parseInt(document.getElementById("stock").value),
            category: document.getElementById("category").value
        }];

        fetch("http://localhost:9090/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(products)
        })
        .then(res => res.json())
        .then(data => {
            alert("Product added successfully!");

            // redirect
            window.location.href = "admin-dashboard.html";
        })
        .catch(err => {
            alert("❌ Error adding product");
            console.error(err);
        });
    }

</script>

</body>
</html>
