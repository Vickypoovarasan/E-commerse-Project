<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar navbar-light">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="brand-text">Add Product</div>
        <button onclick="goBack()" class="btn btn-secondary btn-sm">Back</button>
    </div>
</nav>

<div class="page-container">
    <div class="form card">
        <h2>Add New Product</h2>
        <p class="form-description">Enter the details below to add a product to the catalog.</p>

        <label class="form-label" for="name">Product Name</label>
        <input id="name" class="form-control" placeholder="Enter product name">

        <label class="form-label mt-3" for="description">Description</label>
        <textarea id="description" class="form-control" rows="3" placeholder="Enter product description"></textarea>

        <label class="form-label mt-3" for="price">Price (₹)</label>
        <input id="price" type="number" class="form-control" placeholder="Enter price" step="0.01">

        <label class="form-label mt-3" for="stock">Stock Quantity</label>
        <input id="stock" type="number" class="form-control" placeholder="Enter stock quantity">

        <label class="form-label mt-3" for="category">Category</label>
        <select id="category" class="form-control">
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Home">Home</option>
            <option value="Beauty">Beauty</option>
        </select>

        <button onclick="addProduct()" class="btn btn-custom w-100 mt-4">Add Product</button>
    </div>
</div>

<script>
    const userType = localStorage.getItem("userType");
    if (userType !== "ADMIN") {
        alert("Please login as admin to add products.");
        window.location.href = "admin-login.html";
    }

    function addProduct() {
        const product = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim(),
            price: parseFloat(document.getElementById("price").value),
            stockQuantity: parseInt(document.getElementById("stock").value, 10),
            category: document.getElementById("category").value
        };

        if (!product.name || !product.price || isNaN(product.price) || isNaN(product.stockQuantity)) {
            alert("Please complete all required fields with valid information.");
            return;
        }

        fetch("/api/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify([product])
        })
            .then(res => res.json())
            .then(() => {
                alert("Product added successfully!");
                window.location.href = "admin-dashboard.html";
            })
            .catch(err => {
                console.error(err);
                alert("Error adding product. Please try again.");
            });
    }

    function goBack() {
        window.location.href = "admin-dashboard.html";
    }
</script>

</body>
</html>
