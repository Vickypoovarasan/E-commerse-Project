<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="container auth-page min-vh-100 d-flex align-items-center justify-content-center">

    <div class="row justify-content-center w-100">
        <div class="col-md-4">

            <div class="login-box text-center">

                <h3>Login</h3>

                <input id="username" class="form-control mt-3 " placeholder="Username">

                <input id="password" type="password" class="form-control mt-2" placeholder="Password">

                <button onclick="login()" class="btn btn-custom w-50 mt-3">
                    Login
                </button>

                <div id="errorMsg" class="error-msg">
                    Invalid Username or Password
                </div>


                <p class="mt-3">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </div>

        </div>
    </div>

</div>

<script>

    function login(){

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;

        if(!username || !password){
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("errorMsg").textContent = "Please enter username and password";
            return;
        }

        fetch(`http://localhost:9090/api/users/login?username=${username}&password=${password}`, {
            method: "POST"
        })
        .then(res => res.json())
        .then(user => {

            if(user && user.userId){

                // ✅ Store user data
                localStorage.setItem("userId", user.userId);
                localStorage.setItem("username", user.username);
                localStorage.setItem("role", user.role);
                localStorage.setItem("email", user.email);

                // ✅ Redirect to home
                window.location.href = "index.html";

            } else {
                document.getElementById("errorMsg").style.display = "block";
                document.getElementById("errorMsg").textContent = "Invalid Username or Password";
            }
        })
        .catch(error => {
            console.error("Login error:", error);
            document.getElementById("errorMsg").style.display = "block";
            document.getElementById("errorMsg").textContent = "Login failed. Please try again.";
        });
    }

</script>

</body>
</html>
