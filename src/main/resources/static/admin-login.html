<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

    <link rel="stylesheet" href="theme.css">
</head>

<body>

<div class="container auth-page min-vh-100 d-flex align-items-center justify-content-center">

    <div class="row justify-content-center w-100">
        <div class="col-md-5 col-lg-4">

            <div class="login-box text-center">

                <div class="badge-admin">ADMIN LOGIN</div>

                <h3>Administrator Access</h3>
                <p class="text-muted small">Only admins can access this portal</p>

                <input id="username" class="form-control mt-4" placeholder="Admin Username" autocomplete="off">

                <input id="password" type="password" class="form-control mt-3" placeholder="Password" autocomplete="off">

                <button onclick="adminLogin()" class="btn btn-custom w-60 mt-4">
                    Login as Admin
                </button>

                <div id="errorMsg" class="error-msg"></div>

                <hr class="my-4">

                <p class="text-muted small">
                    <a href="login.html">Customer Login</a>
                </p>

            </div>

        </div>
    </div>

</div>

<script>

    function adminLogin(){

        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let errorMsg = document.getElementById("errorMsg");

        if(!username || !password){
            errorMsg.style.display = "block";
            errorMsg.textContent = "❌ Please enter username and password";
            return;
        }

        fetch(`http://localhost:9090/api/users/login?username=${username}&password=${password}`, {
            method: "POST"
        })
        .then(res => res.json())
        .then(user => {

            if(user && user.userId){

                // ✅ Validate role is ADMIN
                if(user.role !== "ADMIN"){
                    errorMsg.style.display = "block";
                    errorMsg.textContent = "❌ Access Denied! Only admins can login here";
                    return;
                }

                // ✅ Store admin data
                localStorage.setItem("userId", user.userId);
                localStorage.setItem("username", user.username);
                localStorage.setItem("role", user.role);
                localStorage.setItem("email", user.email);
                localStorage.setItem("userType", "ADMIN");

                // ✅ Redirect to admin dashboard
                window.location.href = "admin-dashboard.html";

            } else {
                errorMsg.style.display = "block";
                errorMsg.textContent = "❌ Invalid Username or Password";
            }
        })
        .catch(error => {
            console.error("Login error:", error);
            errorMsg.style.display = "block";
            errorMsg.textContent = "❌ Login failed. Please try again.";
        });
    }

    // Enter key to login
    document.addEventListener("keypress", function(event){
        if(event.key === "Enter"){
            adminLogin();
        }
    });

</script>

</body>
</html>
