<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
  <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-brands/css/uicons-brands.css'>

  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="container auth-page min-vh-100 d-flex align-items-center justify-content-center">

    <div class="row justify-content-center w-50 mt-4" >
      <div class="register-box text-center">

        <h3>Create Account</h3>

        <input id="username" class="form-control mt-3" style="width: 95%;" placeholder="Username">

        <input id="email" class="form-control mt-2" style="width: 95%;" placeholder="Email">

        <input id="password" type="password" class="form-control mt-2" style="width: 95%;" placeholder="Password">

        <button onclick="register()" class="btn btn-custom w-40 mt-3">
          Register
        </button>

        <p class="mt-3">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

      </div>

    </div>
  </div>

</div>

<script>

  function register(){

      fetch("http://localhost:9090/api/users/register", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify({
              username: document.getElementById("username").value,
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
              role: "CUSTOMER"
          })
      })
      .then(res => res.json())
      .then(data => {

          alert("Registered successfully!");
          window.location.href = "login.html";

      })
      .catch(err => {
          alert("❌ Error registering");
          console.error(err);
      });
  }

</script>

</body>
</html>
